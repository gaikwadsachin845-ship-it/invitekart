name: Seed starter invitation templates

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Add original starter templates
        run: npx tsx scripts/seed-starter-templates.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
